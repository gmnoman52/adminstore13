name: Security checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Scan all fetched Git history
        shell: bash
        run: |
          curl --fail --location --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          mkdir /tmp/store-gitleaks
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/store-gitleaks
          /tmp/store-gitleaks/gitleaks git . --log-opts='--all' --redact=100 --no-banner
      - run: npm ci
        working-directory: admin
      - run: npm ci
        working-directory: mobile
      - run: npm audit --audit-level=low
        working-directory: admin
      - run: npm audit --audit-level=low
        working-directory: mobile
      - run: npm run lint
        working-directory: admin
      - run: npm run typecheck
        working-directory: admin
      - run: npm run typecheck && npm run lint
        working-directory: mobile
      - run: node --test scripts/security.test.mjs
      - run: node mobile/scripts/auth-callback.test.mjs
